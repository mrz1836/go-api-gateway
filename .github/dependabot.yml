# Basic dependabot.yml to update gomod and GitHub actions

version: 2
updates:
  - package-ecosystem: "gomod"
    target-branch: "master"
    directory: "/"
    schedule:
      interval: "weekly"
      # Check for Go module updates at 10:00 UTC (6am EST)
      time: "10:00"
    # Reviewers are now driven by .github/CODEOWNERS (the dependabot `reviewers` option was removed by GitHub in 2025)
    assignees:
      - "mrz1836"
    # Labels must be created first
    labels:
      - "update"
    # Batch all Go module bumps into a single PR
    groups:
      gomod:
        patterns:
          - "*"

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    target-branch: "master"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Reviewers are now driven by .github/CODEOWNERS (the dependabot `reviewers` option was removed by GitHub in 2025)
    assignees:
      - "mrz1836"
    labels:
      - "chore"
    open-pull-requests-limit: 10
    # Batch all GitHub Actions bumps into a single PR
    groups:
      github-actions:
        patterns:
          - "*"
